<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{{ title if title else 'Аукцион' }}</title>
</head>
<body>

<nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
    <div class="container-fluid px-4">

        <div class="d-flex align-items-center gap-2">
            {% if current_user.is_authenticated %}
                <a href="/user/{{ current_user.id }}" class="text-white text-decoration-none d-flex align-items-center gap-1 fs-5">
                    <i class="bi bi-person-circle"></i>
                    {{ current_user.name }}
                </a>
                <a class="btn btn-sm btn-outline-light" href="/logout">Выйти</a>
            {% else %}
                <a class="btn btn-sm btn-outline-light" href="/register">Зарегистрироваться</a>
                <a class="btn btn-sm btn-light" href="/login">Войти</a>
            {% endif %}
        </div>

        <a class="navbar-brand position-absolute start-50 translate-middle-x fw-bold"
            href="/"
            style="font-size: 43px; font-family: 'Georgia', serif; letter-spacing: 2px;"
        >Аукцион</a>

        <div class="d-flex align-items-center gap-2 ms-auto">
            {% if current_user.is_authenticated %}
                <span class="text-white fw-semibold fs-5">{{ current_user.balance }} ₽</span>
                <a class="btn btn-sm btn-outline-light" href="/balance">Пополнить</a>
                <a class="btn btn-sm btn-outline-light" href="/balance">Вывести</a>
            {% endif %}
        </div>

    </div>
</nav>

<div class="container-fluid px-4 py-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
